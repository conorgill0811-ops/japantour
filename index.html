<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI 101 • Tour Lab</title>
<link rel="stylesheet" href="https://cesium.com/downloads/cesiumjs/releases/1.145/Build/Cesium/Widgets/widgets.css"><link rel="stylesheet" href="style.css?v=photo-zoom-2"></head><body>
<header><p>ALVERNIA · AI 101 · WEEK 6</p><h1>Tour of my trip through Japan</h1><p>A data-driven virtual tour on a globe </p></header>
<main>
<section aria-label="Tour stop details">
  <p id="message" role="status">Loading…</p>
  <p id="count" class="count"></p>
  <h2 id="name"></h2>
  <button id="photo-open" type="button" hidden aria-label="Enlarge photo" aria-haspopup="dialog" aria-controls="photo-dialog">
    <img id="photo" hidden alt="">
  </button>
  <p id="photo-caption" class="photo-caption" hidden></p>
  <p id="nophoto" class="muted" hidden>No photo for this stop yet.</p>
  <p id="desc"></p>
  <p id="source" class="muted"></p>
  <div class="buttons"><button id="prev">◀ Previous</button><button id="next">Next stop ▶</button></div>
  <div class="city-jumps" role="group" aria-label="Jump to city">
    <button data-city="Tokyo">Tokyo</button>
    <button data-city="Osaka">Osaka</button>
    <button data-city="Hiroshima">Hiroshima</button>
    <button data-city="Home">Home</button>
  </div>
  <p id="city-status" role="status"></p>
  <div id="problems" class="problems" role="alert"></div>
  <p><a href="tests.html">Run tour tests</a></p>
</section>
<div id="globe" aria-label="Interactive 3D globe showing tour stop markers"></div>
</main>
<dialog id="photo-dialog" aria-label="Enlarged stop photo">
  <div class="photo-toolbar">
    <button id="photo-zoom-out" type="button" aria-label="Zoom out">−</button>
    <output id="photo-zoom-level" aria-label="Zoom relative to fitted image">100%</output>
    <button id="photo-zoom-in" type="button" aria-label="Zoom in">+</button>
    <button id="photo-fit" type="button">Fit photo</button>
    <button id="photo-close" type="button" autofocus>Close ×</button>
  </div>
  <p id="photo-help">Scroll to zoom · Drag to pan · Fit photo to reset</p>
  <div id="photo-viewport" tabindex="0" aria-label="Photo viewer" aria-describedby="photo-help">
    <img id="photo-large" alt="" draggable="false">
  </div>
  <p id="photo-large-caption" class="photo-caption" hidden></p>
</dialog>
<footer> Aerial imagery of tour provided by Cesium </footer>
<script src="https://cesium.com/downloads/cesiumjs/releases/1.145/Build/Cesium/Cesium.js"></script>
<script src="places.js"></script><script src="tour-core.js"></script><script src="app.js?v=photo-zoom-2"></script></body></html>
